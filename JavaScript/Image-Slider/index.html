<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Image Slider</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen flex justify-center items-center bg-slate-200">
    <!-- Main container -->
    <div class="w-1/2 relative">
      <!-- Current slide number -->
      <p
        id="slideNumber"
        class="absolute top-4 left-4 z-10 bg-slate-900/40 text-white px-3 py-2 rounded-md backdrop-blur-sm font-medium"
      >
        Slide #1 of 8
      </p>
      <!-- Image -->
      <div class="flex transition-transform duration-500 ease-in-out w-full">
        <img
          id="sliderImage"
          src="https://picsum.photos/id/1015/600/400"
          alt="Programming image slider"
          class="rounded-t-md w-full object-cover aspect-[3/2]"
        />
      </div>

      <!-- Controls -->
      <div class="flex justify-between items-center mt-4">
        <!-- Previous Button -->
        <button
          id="prevBtn"
          class="bg-blue-600 text-white w-24 h-10 rounded-md font-medium flex justify-center items-center cursor-pointer hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Previous
        </button>

        <!-- Numbers -->
        <ul
          class="box-border flex flex-wrap justify-center items-center gap-2"
          id="numbersContainer"
        >
          <!-- Numbers are added dynamically with JavaScript -->
        </ul>

        <!-- Next Button -->
        <button
          id="nextBtn"
          class="bg-blue-600 text-white w-24 h-10 rounded-md font-medium flex justify-center items-center cursor-pointer hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Next
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
