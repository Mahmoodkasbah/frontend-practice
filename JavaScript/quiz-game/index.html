<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- صفحة البداية -->
  <div class="quiz-container" id="start-page">
    <h1>Quiz Time!</h1>
    <p>Test your knowledge with these fun questions</p>
    <button id="start-button">Start Quiz</button>
  </div>

  <!-- صفحة الأسئلة -->
  <div class="quiz-container" id="quiz-page" style="display: none;">
    <h1 id="question">Question</h1>

    <div class="quiz-info">
      <span>Question <span id="current-question">1</span> of <span id="total-questions">10</span></span>
      <span>Score: <span id="score">0</span></span>
    </div>

    <div id="answers-container">
      <button class="answer-button">Answer 1</button>
      <button class="answer-button">Answer 2</button>
      <button class="answer-button">Answer 3</button>
      <button class="answer-button">Answer 4</button>
    </div>

    <button id="next-button">Next</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
