<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> اضافة مهمه جديده</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin-top: 100px;
        gap: 80px;
        background-color: #fff;
      }
      .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 75%;
        padding: 30px;
        background-color: #79767665;
        border-radius: 8px;
      }
      input[type="text"] {
        width: 78%;
        height: 45px;
        padding: 0 15px;
        border: none;
        border-radius: 6px;
        outline: none;
        font-size: 16px;
        background-color: #ffffff;
      }
      textarea {
        width: 80%;
        height: 30px;
        text-align: left;
        margin-right: 10px;
      }

      button {
        width: 18%;
        height: 45px;
        border: none;
        border-radius: 6px;
        background-color: #ff5722;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover {
        background-color: #f4511e;
      }
      #tasksContainer {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 75%;
        padding: 30px;
        background-color: #79767665;
        border-radius: 8px;
        gap: 10px;
      }
      .task-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        height: 45px;
        padding: 0 10px;
        background-color: white;
        border-radius: 6px;
      }
      .task-text {
        font-size: 15px;
      }
      .delete-btn {
        width: 40px;
        height: 25px;
        background-color: red;
        border-radius: 5px;
        font-size: 10px;
        font-weight: bold;
      }
      .delete-btn:hover {
        background-color: darkred;
      }
    </style>
  </head>
  <body>
      <h1 style="color: #333; font-size: 32px; margin-bottom: -40px;">📋 Adding Daily Tasks </h1>

    <div class="container">
      <textarea id="taskInput" placeholder=" Write the task here..."></textarea>
      <button id="btn">Add Task</button>
    </div>
    <div id="tasksContainer"></div>
    <script>
      //المتغيرات الرئيسية
      const taskInput = document.getElementById("taskInput");
      const addBtn = document.getElementById("btn");
      const tasksContainer = document.getElementById("tasksContainer");

      // استرجع المهام المحفوظة
      document.addEventListener("DOMContentLoaded", function () {
        const savedTasks = localStorage.getItem("myTasks");
        if (savedTasks) {
          tasksContainer.innerHTML = savedTasks;
          // إعادة تفعيل زر الحذف للعناصر المسترجعة
          const deleteButtons = tasksContainer.querySelectorAll(".delete-btn");
          deleteButtons.forEach(function (button) {
            button.addEventListener("click", function () {
              button.parentElement.remove();
              localStorage.setItem("myTasks", tasksContainer.innerHTML);
            });
          });
        }
      });

      // إضافة حدث عند الضغط على الزر
      addBtn.addEventListener("click", function () {
        const taskText = taskInput.value;

        // التحقق مما إذا كان الحقل فارغاً أم لا
        if (taskText.trim() === "") {
          alert("Please write the task first!");
          return;
        }
        //إنشاء عنصر جديد في الصفحة ليمثل مهمة واحدة
        const taskCard = document.createElement("div");
        taskCard.classList.add("task-card");
        // إنشاء عنصر لعرض النص المكتوب
        const taskTextDiv = document.createElement("div");
        taskTextDiv.classList.add("task-text");
        taskTextDiv.textContent = taskText;
        //إنشاء زر الحذف
        const deleteBtn = document.createElement("button");
        deleteBtn.classList.add("delete-btn");
        deleteBtn.textContent = "Delete";

        // برمجة زر الحذف لمسح المهمة عند الضغط عليها
        deleteBtn.addEventListener("click", function () {
          taskCard.remove();
          localStorage.setItem("myTasks", tasksContainer.innerHTML);
        });

        taskCard.appendChild(taskTextDiv);
        taskCard.appendChild(deleteBtn);
        tasksContainer.appendChild(taskCard);

        localStorage.setItem("myTasks", tasksContainer.innerHTML);
        // تفريغ خانة الإدخال بعد الإضافة
        taskInput.value = "";
      });
    </script>
  </body>
</html>
